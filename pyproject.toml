[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castor-users"
version = "0.1.0"
description = "Export Castor study permissions users to CSV."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "pandas>=2.0,<3",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[project.scripts]
castor-users = "castor_users.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]